services:
  - type: web
    name: connectome-pharma-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn connectome_products.4_pharma_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: static
    name: connectome-web-suite
    buildCommand: echo "Static site ready"
    staticPublishPath: ./docs
